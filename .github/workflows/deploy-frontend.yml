name: Deploy Frontend to S3 + CloudFront

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    environment: default

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Sync frontend to S3
      run: |
        aws s3 sync ./frontend/ s3://${{ vars.S3_BUCKET_NAME }}/website/ \
          --delete \
          --cache-control "public, max-age=31536000, immutable"

        aws s3 cp ./frontend/index.html s3://${{ vars.S3_BUCKET_NAME }}/website/index.html \
          --cache-control "public, max-age=0, must-revalidate" \
          --content-type "text/html"

    - name: Invalidate CloudFront cache
      run: |
        DIST_ID=$(aws cloudfront list-distributions \
          --query "DistributionList.Items[?Comment=='Frontend CDN distribution'].Id" \
          --output text)

        if [ -z "$DIST_ID" ]; then
          echo "ERROR: Could not find CloudFront distribution with comment 'Frontend CDN distribution'"
          exit 1
        fi

        echo "Invalidating distribution: $DIST_ID"
        aws cloudfront create-invalidation \
          --distribution-id "$DIST_ID" \
          --paths "/*"
